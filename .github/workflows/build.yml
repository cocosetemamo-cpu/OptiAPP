name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: unzip -q OptiJuegos-App.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: gradle -p OptiJuegos-App assembleDebug --no-daemon

      - name: Renombrar APK
        run: cp OptiJuegos-App/app/build/outputs/apk/debug/app-debug.apk OptiJuegos.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OptiJuegos-APK
          path: OptiJuegos.apk

      - name: Subir a Releases (solo con tag vX.X)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: OptiJuegos.apk
